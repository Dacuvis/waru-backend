[phases.setup]
nixPkgs = ["curl", "unzip", "nodejs_20"]
cmds = [
  "curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash"
]

[phases.install]
cmds = [
  "bun --version",
  "bun install --frozen-lockfile"
]

[phases.build]
cmds = [
  "bun run typecheck"
]

[start]
cmd = "bun run index.ts"
